name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 4 * * 1'

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          languages: java

      - name: Build
        shell: bash
        # continue-on-error mirrors the build-validation workflow: the Tycho build
        # may partially succeed (e.g. missing signing certs in CI) while still
        # producing enough compiled bytecode for CodeQL to analyse.
        run: |
          export JAVA_HOME_8=$JAVA_HOME_8_X64
          export JAVA_HOME_11=$JAVA_HOME_11_X64
          export JAVA_HOME_17=$JAVA_HOME_17_X64
          export JAVA_HOME_21=$JAVA_HOME_21_X64
          export PATH=$JAVA_HOME/bin:$PATH
          ./build.sh
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          category: "/language:java"
