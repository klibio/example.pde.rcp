name: 10 build validatation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: checkout
      uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: |
          8
          11
          17
          21

    - name: build
      shell: bash
      run: |
        echo -e "#\n# build\n#\n"
        echo "# configure environment for maven/tycho calls"
        export JAVA_HOME_8=$JAVA_HOME_8_X64
        export JAVA_HOME_11=$JAVA_HOME_11_X64
        export JAVA_HOME_17=$JAVA_HOME_17_X64
        export JAVA_HOME_21=$JAVA_HOME_21_X64
        export PATH=$JAVA_HOME/bin:$PATH
        ./build.sh --jar-signing
      continue-on-error: true

    - name: validate-build-results
      shell: bash
      run: |
        NUM_PRODUCTS=$(find releng/products/target -name 'example.rcp.app.ui.*' -type f | wc -l)
        NUM_REPO_PRODUCT=$(find releng/products/target -name 'products-*.zip' -type f | wc -l)
        NUM_REPO_BINARY=$(find releng/repo.binary/target -name 'repo.binary-*.zip' -type f | wc -l)
        NUM_REPO_SDK=$(find releng/repo.sdk/target -name 'repo.sdk-*.zip' -type f | wc -l)

        [[ $NUM_PRODUCTS -gt 0 ]] & echo "products existing!"
        [[ $NUM_REPO_PRODUCT -ne 0 ]] & echo "product repo existing!"
        [[ $NUM_REPO_BINARY -ne 0 ]] & echo "binary repo existing!"
        [[ $NUM_REPO_SDK -ne 0 ]] & echo "sdk repo existing!"

    - name: upload repo.binary
      uses: actions/upload-artifact@v4
      with:
        name: repo.binary
        path: releng/repo.binary/target/repo.binary-*.zip
        if-no-files-found: warn

    - name: upload repo.sdk
      uses: actions/upload-artifact@v4
      with:
        name: repo.sdk
        path: releng/repo.sdk/target/repo.sdk-*.zip
        if-no-files-found: warn

    - name: upload repo.products
      uses: actions/upload-artifact@v4
      with:
        name: repo.products
        path: releng/products/target/**/**/products-*.zip
        if-no-files-found: warn

    - name: list product archives
      shell: bash
      run: |
        echo "### Product Archives" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        while IFS= read -r f; do
          size=$(du -sh "$f" | cut -f1)
          echo "| $f | $size |" >> $GITHUB_STEP_SUMMARY
        done < <(find releng/products/target \( -name '*.tar.gz' -o -name '*.zip' \) -path '*/example.rcp.*' -type f | sort)

    - name: upload feature-product linux x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.feature.product-linux.gtk.x86_64
        path: releng/products/target/**/**/example.rcp.app.ui.feature.product-*linux.gtk.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload feature-product linux aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.feature.product-linux.gtk.aarch64
        path: releng/products/target/**/example.rcp.app.ui.feature.product-*linux.gtk.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload feature-product macosx x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.feature.product-macosx.cocoa.x86_64
        path: releng/products/target/**/example.rcp.app.ui.feature.product-*macosx.cocoa.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload feature-product macosx aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.feature.product-macosx.cocoa.aarch64
        path: releng/products/target/**/example.rcp.app.ui.feature.product-*macosx.cocoa.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload feature-product win32 x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.feature.product-win32.win32.x86_64
        path: releng/products/target/**/example.rcp.app.ui.feature.product-*win32.win32.x86_64.zip
        if-no-files-found: warn

    - name: upload plugin-product linux x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.plugin.product-linux.gtk.x86_64
        path: releng/products/target/**/example.rcp.app.ui.plugin.product-*linux.gtk.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload plugin-product linux aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.plugin.product-linux.gtk.aarch64
        path: releng/products/target/**/example.rcp.app.ui.plugin.product-*linux.gtk.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload plugin-product macosx x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.plugin.product-macosx.cocoa.x86_64
        path: releng/products/target/**/example.rcp.app.ui.plugin.product-*macosx.cocoa.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload plugin-product macosx aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.plugin.product-macosx.cocoa.aarch64
        path: releng/products/target/**/example.rcp.app.ui.plugin.product-*macosx.cocoa.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload plugin-product win32 x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.plugin.product-win32.win32.x86_64
        path: releng/products/target/**/example.rcp.app.ui.plugin.product-*win32.win32.x86_64.zip
        if-no-files-found: warn

    - name: upload mixed-product linux x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.mixed.product-linux.gtk.x86_64
        path: releng/products/target/**/example.rcp.app.ui.mixed.product-*linux.gtk.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload mixed-product linux aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.mixed.product-linux.gtk.aarch64
        path: releng/products/target/**/example.rcp.app.ui.mixed.product-*linux.gtk.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload mixed-product macosx x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.mixed.product-macosx.cocoa.x86_64
        path: releng/products/target/**/example.rcp.app.ui.mixed.product-*macosx.cocoa.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload mixed-product macosx aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.mixed.product-macosx.cocoa.aarch64
        path: releng/products/target/**/example.rcp.app.ui.mixed.product-*macosx.cocoa.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload mixed-product win32 x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.app.ui.mixed.product-win32.win32.x86_64
        path: releng/products/target/**/example.rcp.app.ui.mixed.product-*win32.win32.x86_64.zip
        if-no-files-found: warn

    - name: upload headless-product linux x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.headless.feature.product-linux.gtk.x86_64
        path: releng/products/target/**/example.rcp.headless.feature.product-*linux.gtk.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload headless-product linux aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.headless.feature.product-linux.gtk.aarch64
        path: releng/products/target/**/example.rcp.headless.feature.product-*linux.gtk.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload headless-product macosx x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.headless.feature.product-macosx.cocoa.x86_64
        path: releng/products/target/**/example.rcp.headless.feature.product-*macosx.cocoa.x86_64.tar.gz
        if-no-files-found: warn

    - name: upload headless-product macosx aarch64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.headless.feature.product-macosx.cocoa.aarch64
        path: releng/products/target/**/example.rcp.headless.feature.product-*macosx.cocoa.aarch64.tar.gz
        if-no-files-found: warn

    - name: upload headless-product win32 x86_64
      uses: actions/upload-artifact@v4
      with:
        name: example.rcp.headless.feature.product-win32.win32.x86_64
        path: releng/products/target/**/example.rcp.headless.feature.product-*win32.win32.x86_64.zip
        if-no-files-found: warn

    - name: publish stable latest-main release assets
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        TAG="latest-main"
        TITLE="Latest main build"

        gh release view "$TAG" >/dev/null 2>&1 || \
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "Rolling release for latest successful main build."

        gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE"

        mkdir -p .release-assets
        shopt -s globstar nullglob

        copy_first() {
          local out_name="$1"
          local pattern="$2"
          local files=( $pattern )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "warning: no match for pattern '$pattern'"
            return 0
          fi
          cp "${files[0]}" ".release-assets/$out_name"
        }

        copy_first "repo.binary.zip" "releng/repo.binary/target/repo.binary-*.zip"
        copy_first "repo.sdk.zip" "releng/repo.sdk/target/repo.sdk-*.zip"
        copy_first "repo.products.zip" "releng/products/target/**/**/products-*.zip"

        copy_first "example.rcp.app.ui.feature.product-linux.gtk.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.feature.product-*linux.gtk.x86_64.tar.gz"
        copy_first "example.rcp.app.ui.feature.product-linux.gtk.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.feature.product-*linux.gtk.aarch64.tar.gz"
        copy_first "example.rcp.app.ui.feature.product-macosx.cocoa.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.feature.product-*macosx.cocoa.x86_64.tar.gz"
        copy_first "example.rcp.app.ui.feature.product-macosx.cocoa.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.feature.product-*macosx.cocoa.aarch64.tar.gz"
        copy_first "example.rcp.app.ui.feature.product-win32.win32.x86_64.zip" "releng/products/target/**/**/example.rcp.app.ui.feature.product-*win32.win32.x86_64.zip"

        copy_first "example.rcp.app.ui.plugin.product-linux.gtk.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.plugin.product-*linux.gtk.x86_64.tar.gz"
        copy_first "example.rcp.app.ui.plugin.product-linux.gtk.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.plugin.product-*linux.gtk.aarch64.tar.gz"
        copy_first "example.rcp.app.ui.plugin.product-macosx.cocoa.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.plugin.product-*macosx.cocoa.x86_64.tar.gz"
        copy_first "example.rcp.app.ui.plugin.product-macosx.cocoa.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.plugin.product-*macosx.cocoa.aarch64.tar.gz"
        copy_first "example.rcp.app.ui.plugin.product-win32.win32.x86_64.zip" "releng/products/target/**/**/example.rcp.app.ui.plugin.product-*win32.win32.x86_64.zip"

        copy_first "example.rcp.app.ui.mixed.product-linux.gtk.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.mixed.product-*linux.gtk.x86_64.tar.gz"
        copy_first "example.rcp.app.ui.mixed.product-linux.gtk.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.mixed.product-*linux.gtk.aarch64.tar.gz"
        copy_first "example.rcp.app.ui.mixed.product-macosx.cocoa.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.mixed.product-*macosx.cocoa.x86_64.tar.gz"
        copy_first "example.rcp.app.ui.mixed.product-macosx.cocoa.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.app.ui.mixed.product-*macosx.cocoa.aarch64.tar.gz"
        copy_first "example.rcp.app.ui.mixed.product-win32.win32.x86_64.zip" "releng/products/target/**/**/example.rcp.app.ui.mixed.product-*win32.win32.x86_64.zip"

        copy_first "example.rcp.headless.feature.product-linux.gtk.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.headless.feature.product-*linux.gtk.x86_64.tar.gz"
        copy_first "example.rcp.headless.feature.product-linux.gtk.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.headless.feature.product-*linux.gtk.aarch64.tar.gz"
        copy_first "example.rcp.headless.feature.product-macosx.cocoa.x86_64.tar.gz" "releng/products/target/**/**/example.rcp.headless.feature.product-*macosx.cocoa.x86_64.tar.gz"
        copy_first "example.rcp.headless.feature.product-macosx.cocoa.aarch64.tar.gz" "releng/products/target/**/**/example.rcp.headless.feature.product-*macosx.cocoa.aarch64.tar.gz"
        copy_first "example.rcp.headless.feature.product-win32.win32.x86_64.zip" "releng/products/target/**/**/example.rcp.headless.feature.product-*win32.win32.x86_64.zip"

        if compgen -G ".release-assets/*" > /dev/null; then
          gh release upload "$TAG" .release-assets/* --clobber
        else
          echo "warning: no files prepared for release upload"
        fi

